<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletivo de Lideranças</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pri:   #1e3a5f;
      --acc:   #2d7dd2;
      --ok:    #2a9d6e;
      --warn:  #e9a31a;
      --err:   #d63b3b;
      --bg:    #f0f3f8;
      --card:  #ffffff;
      --txt:   #1a1f2e;
      --muted: #6b7280;
      --bdr:   #e2e6ed;
      --rad:   10px;
      --shad:  0 1px 4px rgba(0,0,0,0.07), 0 4px 14px rgba(0,0,0,0.05);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; font-size:14px; line-height:1.5; }

    header { background:var(--pri); color:#fff; height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.25); }
    header h1 { font-size:16px; font-weight:800; }
    .hdr-actions { display:flex; gap:8px; }
    .hdr-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:5px 12px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:background .15s; }
    .hdr-btn:hover { background:rgba(255,255,255,0.22); }

    nav { background:var(--card); border-bottom:1px solid var(--bdr); display:flex; padding:0 16px; overflow-x:auto; scrollbar-width:none; }
    nav::-webkit-scrollbar { display:none; }
    .nav-btn { background:none; border:none; border-bottom:2px solid transparent; padding:13px 18px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; transition:color .15s, border-color .15s; }
    .nav-btn:hover { color:var(--txt); }
    .nav-btn.active { color:var(--acc); border-bottom-color:var(--acc); }

    main { max-width:980px; margin:0 auto; padding:24px 16px 60px; }

    .card { background:var(--card); border-radius:var(--rad); box-shadow:var(--shad); padding:20px; margin-bottom:14px; }
    .card-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .card-title { font-size:15px; font-weight:700; }

    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
    @media(max-width:600px) { .metrics { grid-template-columns:1fr 1fr; } }
    .metric { background:var(--card); border-radius:var(--rad); padding:16px; box-shadow:var(--shad); border-top:3px solid var(--acc); }
    .metric.s { border-top-color:var(--ok); }
    .metric.w { border-top-color:var(--warn); }
    .metric.d { border-top-color:var(--err); }
    .metric-n { font-size:28px; font-weight:800; line-height:1; margin-bottom:4px; }
    .metric-l { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }

    .btn { display:inline-flex; align-items:center; gap:5px; padding:8px 15px; border-radius:7px; font-size:13px; font-weight:700; cursor:pointer; border:none; white-space:nowrap; transition:filter .14s; }
    .btn:hover { filter:brightness(.9); }
    .btn-p { background:var(--acc); color:#fff; }
    .btn-g { background:var(--ok); color:#fff; }
    .btn-d { background:var(--err); color:#fff; }
    .btn-o { background:transparent; border:1px solid var(--bdr); color:var(--txt); }
    .btn-o:hover { background:var(--bg); filter:none; }
    .btn-sm { padding:5px 11px; font-size:12px; }
    .btn-xs { padding:3px 8px; font-size:11px; border-radius:5px; }
    .ico-btn { background:none; border:none; cursor:pointer; padding:5px 6px; border-radius:5px; color:var(--muted); font-size:14px; transition:background .12s, color .12s; line-height:1; }
    .ico-btn:hover { background:var(--bg); color:var(--txt); }

    .fg { margin-bottom:13px; }
    .fl { display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
    .fc { width:100%; padding:9px 11px; border:1px solid var(--bdr); border-radius:6px; font-size:13px; font-family:inherit; color:var(--txt); background:#fff; transition:border-color .15s, box-shadow .15s; }
    .fc:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(45,125,210,.12); }
    textarea.fc { resize:vertical; min-height:76px; }
    .frow { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    @media(max-width:480px) { .frow { grid-template-columns:1fr; } }

    .chk-list { display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; border:1px solid var(--bdr); border-radius:6px; padding:10px 12px; background:#fff; }
    .chk-item { display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; }
    .chk-item input[type=checkbox] { width:15px; height:15px; accent-color:var(--acc); cursor:pointer; flex-shrink:0; }

    .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
    .b-pend { background:#fff3cd; color:#7a5900; }
    .b-and  { background:#d0e8ff; color:#004da1; }
    .b-ok   { background:#d1f0e0; color:#155a35; }
    .b-can  { background:#e9ecef; color:#495057; }
    .b-late { background:#ffe0e0; color:#8b1414; }
    .b-ativ { background:#d1f0e0; color:#155a35; }
    .b-inat { background:#e9ecef; color:#495057; }

    .li { display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--bdr); }
    .li:last-child  { border-bottom:none; padding-bottom:0; }
    .li:first-child { padding-top:0; }
    .li-body { flex:1; min-width:0; }
    .li-title { font-size:14px; font-weight:600; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .li-meta  { font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .ph { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
    .pt { font-size:20px; font-weight:800; color:var(--pri); }
    .back-btn { display:inline-flex; align-items:center; gap:5px; background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; margin-bottom:12px; padding:0; }
    .back-btn:hover { color:var(--txt); }

    .empty { text-align:center; padding:36px 20px; color:var(--muted); }
    .empty-ico { font-size:36px; margin-bottom:8px; }
    .empty h3 { font-size:15px; font-weight:700; color:var(--txt); margin-bottom:5px; }

    .prog-wrap { margin-bottom:10px; }
    .prog-lbl { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:4px; }
    .prog-bar { height:6px; background:var(--bdr); border-radius:3px; overflow:hidden; }
    .prog-fill { height:100%; background:var(--ok); border-radius:3px; transition:width .4s; }

    .chips { display:flex; flex-wrap:wrap; gap:7px; }
    .chip { display:inline-flex; align-items:center; gap:5px; background:var(--bg); border:1px solid var(--bdr); border-radius:20px; padding:3px 11px; font-size:12px; color:var(--muted); }
    .chip strong { color:var(--txt); }
    .chip-sm { padding:2px 9px; font-size:11px; }
    .chip-new { border-color:var(--warn); background:#fffbeb; color:#7a5900; }

    .mat-list { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
    .mat-item { display:flex; align-items:center; gap:9px; background:var(--bg); border-radius:7px; padding:8px 10px; }
    .mat-ico  { font-size:16px; flex-shrink:0; }
    .mat-body { flex:1; min-width:0; }
    .mat-name { font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mat-name a { color:var(--acc); text-decoration:none; }
    .mat-name a:hover { text-decoration:underline; }
    .mat-sub { font-size:11px; color:var(--muted); }
    .no-mat { font-size:12px; color:var(--muted); font-style:italic; }

    .informe-blk { border:1px solid var(--bdr); border-radius:8px; padding:14px 15px; margin-bottom:10px; background:#fafbfc; }
    .informe-blk:last-child { margin-bottom:0; }
    .informe-hd { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .informe-pessoa { font-size:14px; font-weight:800; }
    .informe-area { font-size:12px; color:var(--muted); padding:2px 8px; background:var(--bg); border-radius:10px; border:1px solid var(--bdr); }
    .informe-itens { list-style:none; display:flex; flex-direction:column; gap:5px; }
    .informe-itens li { font-size:13px; line-height:1.5; padding-left:14px; position:relative; }
    .informe-itens li::before { content:"•"; position:absolute; left:0; color:var(--acc); font-weight:700; }

    .pauta-blk { border-left:3px solid var(--acc); padding:10px 14px; margin-bottom:12px; background:#f7f9fc; border-radius:0 8px 8px 0; }
    .pauta-blk:last-child { margin-bottom:0; }
    .pauta-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
    .pauta-titulo { font-size:14px; font-weight:800; color:var(--pri); }
    .pauta-notas { font-size:13px; color:var(--muted); line-height:1.65; white-space:pre-wrap; }

    .enc { border:1px solid var(--bdr); border-radius:8px; padding:14px 15px; margin-bottom:10px; background:#fafbfc; }
    .enc:last-child { margin-bottom:0; }
    .enc-top  { display:flex; align-items:flex-start; gap:10px; margin-bottom:7px; }
    .enc-desc { font-size:14px; font-weight:700; flex:1; line-height:1.4; }
    .enc-meta { font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .enc-obs  { font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:10px; }
    .stt-row  { display:flex; gap:5px; flex-wrap:wrap; }
    .stt-btn  { padding:3px 10px; border-radius:5px; font-size:11px; font-weight:700; border:1px solid var(--bdr); cursor:pointer; background:#fff; color:var(--muted); transition:all .12s; }
    .stt-btn.on-pend { background:#fff3cd; color:#7a5900; border-color:#e9a31a; }
    .stt-btn.on-and  { background:#d0e8ff; color:#004da1; border-color:#2d7dd2; }
    .stt-btn.on-ok   { background:#d1f0e0; color:#155a35; border-color:#2a9d6e; }
    .stt-btn.on-can  { background:#e9ecef; color:#495057; border-color:#adb5bd; }
    .enc-mat { border-top:1px solid var(--bdr); margin-top:12px; padding-top:10px; }
    .enc-mat-hd { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:8px; }

    .avatar { width:38px; height:38px; border-radius:50%; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex-shrink:0; }

    .overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(10,18,35,.55); align-items:center; justify-content:center; padding:16px; }
    .overlay.open { display:flex; }
    .modal { background:#fff; border-radius:12px; padding:24px; width:100%; max-width:600px; max-height:94vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.22); animation:pop .17s ease; }
    @keyframes pop { from { transform:translateY(10px); opacity:0; } to { transform:none; opacity:1; } }
    .modal-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .modal-title { font-size:16px; font-weight:800; }
    .mtabs { display:flex; border-bottom:1px solid var(--bdr); margin-bottom:16px; }
    .mtab { padding:8px 18px; border:none; background:none; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .14s; }
    .mtab.active { color:var(--acc); border-bottom-color:var(--acc); }

    .file-drop { border:2px dashed var(--bdr); border-radius:8px; padding:22px 16px; text-align:center; cursor:pointer; transition:all .14s; color:var(--muted); display:block; }
    .file-drop:hover { border-color:var(--acc); color:var(--acc); background:rgba(45,125,210,.04); }
    .file-drop input { display:none; }
    .file-drop-ico { font-size:26px; margin-bottom:5px; }
    .alert-w { background:#fff3cd; color:#7a5900; border:1px solid #ffd54f; padding:9px 13px; border-radius:7px; font-size:12px; margin-bottom:12px; }

    .fbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .fbar .fc { width:auto; flex:1; min-width:140px; }
    .c-card { cursor:pointer; transition:box-shadow .15s, transform .12s; }
    .c-card:hover { box-shadow:0 6px 24px rgba(0,0,0,.12); transform:translateY(-1px); }
    .dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media(max-width:620px) { .dash-grid { grid-template-columns:1fr; } }
    .slbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:8px; }
    .rel-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; }
    .rel-tag { background:var(--bg); border:1px solid var(--bdr); border-radius:6px; padding:5px 10px; font-size:12px; }
    .rel-tag span { font-weight:700; color:var(--txt); }
    .rel-tag small { color:var(--muted); }

    /* ── Preview da relatoria ── */
    .prev-section { background:var(--bg); border-radius:8px; padding:14px; margin-bottom:12px; }
    .prev-section-title { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:10px; }
    .prev-row { display:flex; align-items:flex-start; gap:8px; margin-bottom:6px; font-size:13px; }
    .prev-ico { font-size:14px; flex-shrink:0; margin-top:1px; }
    .prev-label { color:var(--muted); flex-shrink:0; }
    .prev-val { font-weight:600; flex:1; }
    .prev-item { background:#fff; border:1px solid var(--bdr); border-radius:6px; padding:8px 12px; margin-bottom:6px; font-size:13px; }
    .prev-item:last-child { margin-bottom:0; }
    .prev-item-title { font-weight:700; margin-bottom:3px; }
    .prev-item-sub { color:var(--muted); font-size:12px; }
    .prev-nome-new { color:var(--warn); font-size:11px; margin-left:4px; font-weight:700; }
    .dot-ok  { color:var(--ok); }
    .dot-new { color:var(--warn); }

    #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--pri); color:#fff; padding:9px 20px; border-radius:8px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s; z-index:999; white-space:nowrap; }
    #toast.show { opacity:1; }

    /* ── Login ── */
    #login-screen { position:fixed; inset:0; background:var(--pri); display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px; }
    #login-screen.hidden { display:none; }
    .login-box { background:#fff; border-radius:16px; padding:36px 32px; width:100%; max-width:380px; box-shadow:0 24px 60px rgba(0,0,0,.35); }
    .login-logo { font-size:44px; text-align:center; margin-bottom:10px; }
    .login-title { font-size:20px; font-weight:800; color:var(--pri); text-align:center; margin-bottom:4px; }
    .login-sub { font-size:13px; color:var(--muted); text-align:center; margin-bottom:28px; }
    .login-err { background:#ffe0e0; color:#8b1414; border:1px solid #f5b8b8; border-radius:7px; padding:9px 13px; font-size:13px; margin-bottom:14px; display:none; }
    .login-err.show { display:block; }
    .pend-card { border-left:4px solid var(--warn); background:#fffdf0; border-radius:0 8px 8px 0; padding:12px 14px; margin-bottom:8px; }
    .pend-card:last-child { margin-bottom:0; }
    .enc-reuniao { font-size:11px; color:var(--muted); margin-bottom:4px; font-weight:600; }

    /* ── Calendário ── */
    .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .cal-month-lbl { font-size:16px; font-weight:800; color:var(--pri); letter-spacing:-.2px; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .cal-dow { text-align:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); padding:4px 2px 8px; }
    .cal-cell { text-align:center; padding:7px 4px 5px; border-radius:8px; font-size:13px; font-weight:500; position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:40px; justify-content:center; transition:background .12s; }
    .cal-empty { pointer-events:none; }
    .cal-has-meeting { background:var(--bg); cursor:pointer; font-weight:700; color:var(--acc); border:1px solid var(--bdr); }
    .cal-has-meeting:hover { background:var(--acc); color:#fff; border-color:var(--acc); }
    .cal-today { background:var(--pri) !important; color:#fff !important; font-weight:800; border-color:var(--pri) !important; }
    .cal-dot { display:block; width:5px; height:5px; border-radius:50%; background:var(--acc); }
    .cal-has-meeting:hover .cal-dot, .cal-today .cal-dot { background:#fff; }
    .cal-legend { display:flex; gap:14px; font-size:11px; color:var(--muted); margin-top:12px; padding-top:10px; border-top:1px solid var(--bdr); }
    .cal-legend-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:middle; }
  </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🤝</div>
    <div class="login-title">Coletivo de Lideranças</div>
    <div class="login-sub">Sistema restrito ao coletivo</div>
    <div class="login-err" id="login-err">Senha incorreta. Tente novamente.</div>
    <div class="fg">
      <label class="fl">Senha de acesso</label>
      <input class="fc" type="password" id="login-pw" placeholder="••••••••••" onkeydown="if(event.key==='Enter')AUTH.login()">
    </div>
    <button class="btn btn-p" style="width:100%;justify-content:center;padding:11px;margin-top:4px" onclick="AUTH.login()">Entrar</button>
  </div>
</div>

<header>
  <h1>🤝 Coletivo de Lideranças</h1>
  <div class="hdr-actions">
    <button class="hdr-btn" onclick="App.openModal('config')">⚙ Config</button>
    <button class="hdr-btn" onclick="AUTH.logout()">Sair</button>
    <input type="file" id="fi" accept=".json" style="display:none" onchange="App.importData(event)">
  </div>
</header>

<nav>
  <button class="nav-btn" id="nav-dashboard"       onclick="App.go('dashboard')">Dashboard</button>
  <button class="nav-btn" id="nav-reunioes"         onclick="App.go('reunioes')">Reuniões</button>
  <button class="nav-btn" id="nav-encaminhamentos"  onclick="App.go('encaminhamentos')">Encaminhamentos</button>
  <button class="nav-btn" id="nav-pessoas"          onclick="App.go('pessoas')">Pessoas</button>
</nav>

<main id="app"></main>

<div class="overlay" id="overlay" onclick="App.overlayClick(event)">
  <div class="modal" id="modal"></div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   AUTH — Controle de acesso
   Senha padrão: liderancas2026
   Para alterar: use o menu Config dentro do sistema
============================================================ */
const AUTH = {
  DEFAULT_PW: 'liderancas2026',
  getPassword() { return localStorage.getItem('ldr_pw') || this.DEFAULT_PW; },
  check()  { return sessionStorage.getItem('ldr_auth') === '1'; },
  login() {
    const pw = document.getElementById('login-pw')?.value || '';
    if (pw === this.getPassword()) {
      sessionStorage.setItem('ldr_auth','1');
      document.getElementById('login-screen').classList.add('hidden');
      App.go('dashboard');
    } else {
      const err = document.getElementById('login-err');
      err.classList.add('show');
      const inp = document.getElementById('login-pw');
      inp.value = ''; inp.focus();
      setTimeout(() => err.classList.remove('show'), 3000);
    }
  },
  logout() {
    sessionStorage.removeItem('ldr_auth');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-pw').value = '';
    document.getElementById('login-pw').focus();
  },
  changePassword(old, nw, nw2) {
    if (old !== this.getPassword()) return 'Senha atual incorreta.';
    if (!nw || nw.length < 6)     return 'Nova senha deve ter ao menos 6 caracteres.';
    if (nw !== nw2)                return 'As senhas não coincidem.';
    localStorage.setItem('ldr_pw', nw);
    return null;
  }
};

/* ============================================================
   UTILS
============================================================ */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);

function fmtDate(s) {
  if (!s) return '—';
  return new Date(s + 'T12:00:00').toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function isLate(s) {
  if (!s) return false;
  const t = new Date(); t.setHours(0,0,0,0);
  return new Date(s + 'T00:00:00') < t;
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function safeUrl(u) {
  if (!u) return null; u = u.trim();
  if (/^https?:\/\//i.test(u) || /^ftp:\/\//i.test(u)) return u;
  if (/^[a-zA-Z0-9]/.test(u) && !u.startsWith('/')) return 'https://' + u;
  return null;
}
function fmtBytes(b) {
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
function getPessoa(data, id) { return data.pessoas.find(p => p.id === id); }
function getNomes(data, ids) {
  if (!ids || !ids.length) return null;
  return ids.map(id => { const p = getPessoa(data, id); return p ? p.nome : '?'; }).join(', ');
}
function badgeStatus(status, prazo) {
  if ((status === 'pendente' || status === 'em_andamento') && prazo && isLate(prazo))
    return '<span class="badge b-late">Atrasado</span>';
  const cls = { pendente:'b-pend', em_andamento:'b-and', concluido:'b-ok', cancelado:'b-can' };
  const lbl = { pendente:'Pendente', em_andamento:'Em andamento', concluido:'Concluído', cancelado:'Cancelado' };
  return `<span class="badge ${cls[status]||''}">${lbl[status]||status}</span>`;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2400);
}
function renderMats(mats, delCb) {
  if (!mats || !mats.length) return '<p class="no-mat">Nenhum material vinculado.</p>';
  return '<div class="mat-list">' + mats.map((m, i) => {
    const del = delCb ? `<button class="ico-btn" style="color:var(--err)" onclick="${delCb}(${i})">✕</button>` : '';
    if (m.tipo === 'link')
      return `<div class="mat-item"><span class="mat-ico">🔗</span><div class="mat-body">
        <div class="mat-name"><a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.titulo||m.url)}</a></div>
        ${m.descricao?`<div class="mat-sub">${esc(m.descricao)}</div>`:''}
      </div>${del}</div>`;
    return `<div class="mat-item"><span class="mat-ico">📄</span><div class="mat-body">
      <div class="mat-name"><a href="${m.dados}" download="${esc(m.nome)}">${esc(m.nome)}</a></div>
      ${m.tamanho?`<div class="mat-sub">${fmtBytes(m.tamanho)}</div>`:''}
    </div>${del}</div>`;
  }).join('') + '</div>';
}

/* ============================================================
   PARSER DE RELATORIA
============================================================ */
function matchPessoa(data, name) {
  if (!name) return null;
  const n = name.trim().toLowerCase();
  return data.pessoas.find(p => p.nome.toLowerCase() === n) ||
         data.pessoas.find(p => p.nome.toLowerCase().split(' ')[0] === n.split(' ')[0]) ||
         data.pessoas.find(p => p.nome.toLowerCase().includes(n) || n.includes(p.nome.toLowerCase().split(' ')[0])) ||
         null;
}

function parseRelatoria(text) {
  const MESES = {
    'janeiro':'01','fevereiro':'02','marco':'03','marco':'03','abril':'04',
    'maio':'05','junho':'06','julho':'07','agosto':'08','setembro':'09',
    'outubro':'10','novembro':'11','dezembro':'12'
  };

  const result = {
    data:'', titulo:'Lideranças',
    participantesNomes:[], relatoriaName:'', proximaRelatoriaName:'',
    informes:[], pautas:[], encaminhamentos:[]
  };

  // Normaliza string removendo acentos de forma segura (usando escapes Unicode)
  const strip = (s) => s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

  // Detecta se linha é cabeçalho de seção principal — tolera maiúsculas, dois-pontos, asteriscos
  const SECTION_MAP = {
    'informes':'INFORMES', 'informe':'INFORMES',
    'pautas':'PAUTAS', 'pauta':'PAUTAS',
    'encaminhamentos':'ENCAMINHAMENTOS', 'encaminhamento':'ENCAMINHAMENTOS'
  };
  const getSectionKey = (line) => {
    const t = strip(line).replace(/[*#_:!\s]+$/, '').replace(/^[*#_!\s]+/, '');
    return SECTION_MAP[t] || null;
  };

  // Divide o texto em blocos por seção — abordagem mais robusta que state machine
  const rawLines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const chunks = [{ key:'HEADER', lines:[] }];
  for (const line of rawLines) {
    const sec = getSectionKey(line);
    if (sec) chunks.push({ key:sec, lines:[] });
    else chunks[chunks.length-1].lines.push(line);
  }

  // ── HEADER
  for (const line of (chunks.find(c=>c.key==='HEADER')?.lines || [])) {
    const t = line.trim();
    if (!t) continue;
    const dm = t.match(/(\d{1,2})\s+de\s+(\w+)\s+de\s+(\d{4})/i);
    if (dm) {
      const mn = MESES[strip(dm[2])];
      if (mn) result.data = `${dm[3]}-${mn}-${dm[1].padStart(2,'0')}`;
    }
    const sep = t.match(/[|｜]\s*(.+)/);
    if (sep) result.titulo = sep[1].trim();
    const pm = t.match(/participantes\s*:?\s*(.+)/i);
    if (pm) result.participantesNomes = pm[1].split(/,|\s+e\s+/).map(s=>s.trim()).filter(s=>s.length>1);
    const rm = t.match(/relator[ia]*\s*:?\s*(.+)/i);
    if (rm && !/pr[oó]xim/i.test(t)) result.relatoriaName = rm[1].trim();
    const px = t.match(/pr[oó]xim[ao].*?:?\s*(.+)/i);
    if (px) result.proximaRelatoriaName = px[1].trim();
  }

  // ── INFORMES
  // Detecta linha de pessoa: "Nome I Área" ou "Nome | Área" ou "Nome / Área"
  // O separador pode ser I (letra), | (pipe), / (barra), ou variantes Unicode visuais
  const personSep = /\s+[|I\/｜∣│]\s+/;
  const isPersonLine = (t) => {
    if (/^[-•·*]/.test(t)) return false;
    if (!personSep.test(t)) return false;
    const parts = t.split(personSep);
    if (parts.length < 2) return false;
    const nome = parts[0].trim();
    // Nome: 1-3 palavras, começa com maiúscula
    return /^[A-ZÁÉÍÓÚÀÂÊÔÃÕ]/.test(nome) && nome.split(/\s+/).length <= 3;
  };

  // ── INFORMES — captura texto corrido por pessoa, sem granularidade
  const informeChunk = chunks.find(c=>c.key==='INFORMES');
  if (informeChunk) {
    let curNome='', curArea='', curLinhas=[];
    const flushInforme = () => {
      if (curNome) result.informes.push({ pessoaName:curNome, area:curArea, texto:curLinhas.join('\n') });
      curNome=''; curArea=''; curLinhas=[];
    };
    for (const raw of informeChunk.lines) {
      const t = raw.trim();
      if (!t) continue;
      if (isPersonLine(t)) {
        flushInforme();
        const parts = t.split(personSep);
        curNome = parts[0].trim();
        curArea = parts.slice(1).join(' ').trim();
        continue;
      }
      if (curNome) {
        // Remove bullet se houver, mas mantém o texto corrido
        const linha = t.replace(/^[-•·*→]\s*/,'').trim();
        if (linha) curLinhas.push(linha);
      }
    }
    flushInforme();
  }

  // ── PAUTAS — texto corrido único, sem divisão por itens
  const pautaChunk = chunks.find(c=>c.key==='PAUTAS');
  if (pautaChunk) {
    const linhas = pautaChunk.lines
      .map(l => l.replace(/^[-•·*→▪]\s*/,'').trim())
      .filter(l => l.length > 0);
    if (linhas.length > 0) {
      result.pautas.push({ titulo:'', notas: linhas.join('\n') });
    }
  }

  // ── ENCAMINHAMENTOS
  // Bullet = headline (descricao); linhas seguintes sem bullet = descrição (observacoes)
  const encChunk = chunks.find(c=>c.key==='ENCAMINHAMENTOS');
  if (encChunk) {
    let curEnc = null;
    const flushEnc = () => {
      if (curEnc && curEnc.descricao.trim()) result.encaminhamentos.push(curEnc);
      curEnc = null;
    };
    for (const raw of encChunk.lines) {
      const t = raw.trim();
      if (!t) continue;
      if (/^[-•·*→▪>]\s/.test(t) || /^\d+[.)]\s/.test(t)) {
        flushEnc();
        let txt = t.replace(/^[-•·*→▪>]\s*/,'').replace(/^\d+[.)]\s*/,'').replace(/;\s*$/,'').trim();
        let respName = null;
        const m1 = txt.match(/^([A-ZÁÉÍÓÚÀÂÊÔÃÕ][\wáéíóúàâêôãõçÁÉÍÓÚÀÂÊÔÃÕÇ]+(?:\s+[\wáéíóúàâêôãõçÁÉÍÓÚÀÂÊÔÃÕÇ]+)?)\s*:\s*(.+)/);
        if (m1 && m1[1].split(/\s+/).length <= 2) { respName=m1[1]; txt=m1[2].trim(); }
        const m2 = !respName && txt.match(/\(([A-ZÁÉÍÓÚÀÂÊÔÃÕ][a-záéíóúàâêôãõ]+)\)/);
        if (m2) { respName=m2[1]; txt=txt.replace(m2[0],'').trim(); }
        curEnc = { descricao:txt, respName, observacoes:'' };
      } else if (curEnc && t.length > 2) {
        // Linha sem bullet = descrição do encaminhamento atual
        curEnc.observacoes += (curEnc.observacoes ? '\n' : '') + t;
      }
    }
    flushEnc();
  }

  return result;
}

/* ============================================================
   DB
============================================================ */
const DB = {
  KEY: 'liderancas_v3',
  get() {
    try { const r = localStorage.getItem(this.KEY); return r ? JSON.parse(r) : { pessoas:[], reunioes:[] }; }
    catch { return { pessoas:[], reunioes:[] }; }
  },
  save(d) {
    try { localStorage.setItem(this.KEY, JSON.stringify(d)); }
    catch(e) { if (e.name==='QuotaExceededError') alert('Armazenamento cheio. Arquivo muito grande.\nPrefira hospedar no Google Drive e inserir o link.'); }
  },
  export() {
    const blob = new Blob([JSON.stringify(this.get(), null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'liderancas_' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  },
  import(str) {
    const d = JSON.parse(str);
    if (!Array.isArray(d.pessoas) || !Array.isArray(d.reunioes)) throw new Error('formato inválido');
    this.save(d);
  }
};

/* ============================================================
   APP
============================================================ */
const App = {
  view:'dashboard', params:{}, filters:{ status:'', pessoa:'' },
  _payload:null, _tab:'link', _file:null, _parsed:null,
  calYear: new Date().getFullYear(), calMonth: new Date().getMonth(),

  calPrev() {
    if (this.calMonth === 0) { this.calYear--; this.calMonth = 11; }
    else this.calMonth--;
    this.render();
  },
  calNext() {
    if (this.calMonth === 11) { this.calYear++; this.calMonth = 0; }
    else this.calMonth++;
    this.render();
  },
  renderCal(data) {
    const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const DIAS  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const y = this.calYear, m = this.calMonth;
    const firstDow   = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const today = new Date();
    const todayDay = (today.getFullYear()===y && today.getMonth()===m) ? today.getDate() : -1;

    // Monta mapa dia → reunião
    const byDay = {};
    (data.reunioes||[]).forEach(r => {
      if (!r.data) return;
      const d = new Date(r.data + 'T12:00:00');
      if (d.getFullYear()===y && d.getMonth()===m) {
        const dd = d.getDate();
        if (!byDay[dd]) byDay[dd] = [];
        byDay[dd].push(r);
      }
    });

    let cells = DIAS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for (let i=0; i<firstDow; i++) cells += '<div class="cal-cell cal-empty"></div>';
    for (let d=1; d<=daysInMonth; d++) {
      const meetings = byDay[d];
      const isToday  = d === todayDay;
      let cls = 'cal-cell';
      if (meetings) cls += ' cal-has-meeting';
      if (isToday)  cls += ' cal-today';
      const click = meetings ? `onclick="App.go('reuniao',{id:'${meetings[0].id}'})"` : '';
      cells += `<div class="${cls}" ${click}>${d}${meetings?'<span class="cal-dot"></span>':''}</div>`;
    }

    return `<div class="card" style="margin-bottom:14px">
      <div class="cal-nav">
        <button class="ico-btn" style="font-size:18px;font-weight:700" onclick="App.calPrev()">‹</button>
        <span class="cal-month-lbl">${MESES[m]} ${y}</span>
        <button class="ico-btn" style="font-size:18px;font-weight:700" onclick="App.calNext()">›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend">
        <span><span class="cal-legend-dot" style="background:var(--acc)"></span>Reunião registrada</span>
        <span><span class="cal-legend-dot" style="background:var(--pri)"></span>Hoje</span>
      </div>
    </div>`;
  },

  go(view, params={}) {
    this.view=view; this.params=params;
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    const nb = document.getElementById('nav-' + (view==='reuniao'?'reunioes':view));
    if (nb) nb.classList.add('active');
    this.render(); window.scrollTo(0,0);
  },

  render() {
    const el=document.getElementById('app'), data=DB.get();
    switch(this.view) {
      case 'dashboard':       el.innerHTML=this.vDash(data);    break;
      case 'reunioes':        el.innerHTML=this.vReunioes(data); break;
      case 'reuniao':         el.innerHTML=this.vReuniao(data);  break;
      case 'encaminhamentos': el.innerHTML=this.vEncs(data);     break;
      case 'pessoas':         el.innerHTML=this.vPessoas(data);  break;
    }
  },

  /* ── DASHBOARD ── */
  vDash(data) {
    const all  = data.reunioes.flatMap(r=>(r.encaminhamentos||[]).map(e=>({...e,_rid:r.id,_rdata:r.data})));
    const tot  = all.length, ok=all.filter(e=>e.status==='concluido').length;
    const open = all.filter(e=>e.status!=='concluido'&&e.status!=='cancelado').length;
    const late = all.filter(e=>(e.status==='pendente'||e.status==='em_andamento')&&isLate(e.prazo)).length;
    const pct  = tot ? Math.round(ok/tot*100) : 0;
    const recent = [...data.reunioes].sort((a,b)=>new Date(b.data)-new Date(a.data)).slice(0,4);
    const urgent = all.filter(e=>e.status!=='concluido'&&e.status!=='cancelado')
      .sort((a,b)=>{if(!a.prazo)return 1;if(!b.prazo)return -1;return new Date(a.prazo)-new Date(b.prazo);}).slice(0,5);
    return `
      <div class="ph">
        <span class="pt">Dashboard</span>
        <button class="btn btn-g btn-sm" onclick="App.openModal('colar-relatoria')">📋 Colar Relatoria</button>
      </div>
      ${this.renderCal(data)}
      <div class="metrics" style="grid-template-columns:repeat(3,1fr)">
        <div class="metric s"><div class="metric-n">${ok}</div><div class="metric-l">Concluídos</div></div>
        <div class="metric w"><div class="metric-n">${open}</div><div class="metric-l">Em aberto</div></div>
        <div class="metric d"><div class="metric-n">${late}</div><div class="metric-l">Atrasados</div></div>
      </div>
      ${tot?`<div class="card" style="margin-bottom:14px">
        <div class="prog-lbl"><span style="font-weight:700">Progresso geral</span><span>${pct}%</span></div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
        <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted)">
          <span>✅ ${ok}</span><span>🔄 ${all.filter(e=>e.status==='em_andamento').length}</span><span>⏳ ${all.filter(e=>e.status==='pendente').length}</span>
        </div>
      </div>`:''}
      <div class="dash-grid">
        <div class="card">
          <div class="card-hdr"><span class="card-title">Últimas Reuniões</span></div>
          ${recent.length ? recent.map(r=>{
            const rl=(r.encaminhamentos||[]).filter(e=>(e.status==='pendente'||e.status==='em_andamento')&&isLate(e.prazo)).length;
            const parts=(r.participantes||[]).map(id=>{const p=getPessoa(data,id);return p?p.nome:'?';});
            return `<div class="li c-card" onclick="App.go('reuniao',{id:'${r.id}'})">
              <div class="li-body">
                <div class="li-title">📅 ${fmtDate(r.data)}${r.titulo?' · '+esc(r.titulo):''}</div>
                <div class="li-meta">
                  ${parts.length?`<span>👥 ${parts.slice(0,3).join(', ')}${parts.length>3?` +${parts.length-3}`:''}</span>`:''}
                  <span>${(r.encaminhamentos||[]).length} enc.</span>
                  ${rl?`<span style="color:var(--err)">⚠️ ${rl}</span>`:''}
                </div>
              </div>
              <span style="color:var(--muted);font-size:18px">›</span>
            </div>`;
          }).join('') : '<div class="empty" style="padding:16px"><p>Nenhuma reunião ainda.</p></div>'}
        </div>
        <div class="card">
          <div class="card-hdr"><span class="card-title">Encaminhamentos Urgentes</span>
            <button class="btn btn-o btn-sm" onclick="App.go('encaminhamentos')">Ver todos</button>
          </div>
          ${urgent.length ? urgent.map(e=>`<div class="li">
            <div class="li-body">
              <div class="li-title">${esc(e.descricao||'').slice(0,60)}${(e.descricao||'').length>60?'…':''}</div>
              <div class="li-meta">
                ${(e.responsaveis||[]).length?`<span>👤 ${esc(getNomes(data,e.responsaveis))}</span>`:''}
                ${e.prazo?`<span>${isLate(e.prazo)?'⚠️ ':''}${fmtDate(e.prazo)}</span>`:''}
                ${badgeStatus(e.status,e.prazo)}
              </div>
            </div>
          </div>`).join('') : '<div class="empty" style="padding:16px"><p>Nenhum em aberto.</p></div>'}
        </div>
      </div>
      ${data.pessoas.filter(p=>p.status==='ativo').length?`<div class="card" style="margin-top:2px">
        <div class="card-hdr"><span class="card-title">Coletivo ativo</span>
          <button class="btn btn-o btn-sm" onclick="App.go('pessoas')">Gerenciar</button>
        </div>
        <div class="chips">${data.pessoas.filter(p=>p.status==='ativo').map(p=>`
          <div class="chip"><strong>${esc(p.nome)}</strong>${p.area?`<span>· ${esc(p.area)}</span>`:''}</div>`).join('')}
        </div>
      </div>`:''}`;
  },

  /* ── REUNIÕES LISTA ── */
  vReunioes(data) {
    const sorted = [...data.reunioes].sort((a,b)=>new Date(b.data)-new Date(a.data));
    return `
      <div class="ph">
        <span class="pt">Reuniões</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-g" onclick="App.openModal('colar-relatoria')">📋 Colar Relatoria</button>
          <button class="btn btn-o" onclick="App.openModal('nova-reuniao')">+ Manual</button>
        </div>
      </div>
      ${!sorted.length
        ? `<div class="card"><div class="empty"><div class="empty-ico">📋</div><h3>Nenhuma reunião registrada</h3>
            <p>Cole uma relatoria ou crie manualmente.</p>
            <div style="margin-top:16px"><button class="btn btn-g" onclick="App.openModal('colar-relatoria')">📋 Colar Relatoria</button></div>
           </div></div>`
        : sorted.map(r=>{
            const encs=r.encaminhamentos||[], ok=encs.filter(e=>e.status==='concluido').length;
            const rl=encs.filter(e=>(e.status==='pendente'||e.status==='em_andamento')&&isLate(e.prazo)).length;
            const parts=(r.participantes||[]).map(id=>{const p=getPessoa(data,id);return p?p.nome:'?';});
            return `<div class="card c-card" onclick="App.go('reuniao',{id:'${r.id}'})">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
                <div style="flex:1;min-width:0">
                  <div style="font-size:15px;font-weight:800;margin-bottom:5px">📅 ${fmtDate(r.data)}${r.titulo?` <span style="font-weight:500;color:var(--muted)">· ${esc(r.titulo)}</span>`:''}</div>
                  ${parts.length?`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">👥 ${parts.join(', ')}</div>`:''}
                  <div style="display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap">

                    ${(r.informes||[]).length?`<span>📣 ${r.informes.length} informes</span>`:''}
                    ${(r.pautas||[]).length?`<span>🗂 ${r.pautas.length} pautas</span>`:''}

                  </div>
                </div>
                <span style="color:var(--muted);font-size:20px;margin-top:2px">›</span>
              </div>
            </div>`;
          }).join('')}`;
  },

  /* ── REUNIÃO DETALHE ── */
  vReuniao(data) {
    const r=data.reunioes.find(x=>x.id===this.params.id);
    if (!r) return '<p>Reunião não encontrada.</p>';
    const rid=r.id, encs=r.encaminhamentos||[], mats=r.materiais||[], infs=r.informes||[], pautas=r.pautas||[];
    const parts=(r.participantes||[]).map(id=>{const p=getPessoa(data,id);return p?p.nome:'?';});
    const relNome=r.relatoria?(getPessoa(data,r.relatoria)?.nome||'?'):null;
    const proxNome=r.proximaRelatoria?(getPessoa(data,r.proximaRelatoria)?.nome||'?'):null;
    const sttCls={pendente:'on-pend',em_andamento:'on-and',concluido:'on-ok',cancelado:'on-can'};
    const sttLbl={pendente:'Pendente',em_andamento:'Em andamento',concluido:'Concluído',cancelado:'Cancelado'};

    return `
      <button class="back-btn" onclick="App.go('reunioes')">← Voltar</button>

        <span class="pt">📅 ${fmtDate(r.data)}${r.titulo?' · '+esc(r.titulo):''}</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-o btn-sm" onclick="App.openModal('editar-reuniao','${rid}')">Editar</button>
          <button class="btn btn-d btn-sm" onclick="App.delReuniao('${rid}')">Excluir</button>
        </div>

      <div class="card">
        <div style="display:flex;gap:24px;flex-wrap:wrap">
          <div style="flex:1;min-width:180px">
            <div class="slbl">👥 Participantes</div>
            ${parts.length?`<div class="chips">${parts.map(n=>`<div class="chip chip-sm"><strong>${esc(n)}</strong></div>`).join('')}</div>`
              :'<span style="font-size:13px;color:var(--muted)">Não registrado</span>'}
          </div>
          <div>
            <div class="slbl">📝 Relatoria</div>
            <div class="rel-row">
              ${relNome?`<div class="rel-tag"><small>Fez:</small> <span>${esc(relNome)}</span></div>`:'<span style="font-size:13px;color:var(--muted)">—</span>'}
              ${proxNome?`<span style="color:var(--muted)">→</span><div class="rel-tag"><small>Próxima:</small> <span>${esc(proxNome)}</span></div>`:''}
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-hdr"><span class="card-title">📣 Informes</span>
          <button class="btn btn-o btn-sm" onclick="App.openModal('add-informe','${rid}')">+ Adicionar</button>
        </div>
        ${!infs.length?'<p style="font-size:13px;color:var(--muted)">Nenhum informe registrado.</p>'
          :infs.map((inf,idx)=>{const p=getPessoa(data,inf.pessoaId);return `<div class="informe-blk">
            <div class="informe-hd">
              <span class="informe-pessoa">${esc(p?.nome||inf.pessoaId||'?')}</span>
              ${inf.area?`<span class="informe-area">${esc(inf.area)}</span>`:''}
              <div style="margin-left:auto;display:flex;gap:3px">
                <button class="ico-btn" onclick="App.openModal('editar-informe',{rid:'${rid}',idx:${idx}})">✏️</button>
                <button class="ico-btn" style="color:var(--err)" onclick="App.delInfome('${rid}',${idx})">🗑️</button>
              </div>
            </div>
            ${inf.texto
              ? `<p style="font-size:13px;line-height:1.7;color:var(--txt);white-space:pre-wrap">${esc(inf.texto)}</p>`
              : (inf.itens||[]).length
                ? `<ul class="informe-itens">${inf.itens.map(it=>`<li>${esc(it)}</li>`).join('')}</ul>`
                : '<p style="font-size:13px;color:var(--muted);font-style:italic">Sem conteúdo registrado.</p>'
            }
          </div>`;}).join('')}
      </div>

      <div class="card">
        <div class="card-hdr"><span class="card-title">🗂 Pautas</span>
          <button class="btn btn-o btn-sm" onclick="App.openModal('add-pauta','${rid}')">+ Adicionar</button>
        </div>
        ${!pautas.length?'<p style="font-size:13px;color:var(--muted)">Nenhuma pauta registrada.</p>'
          :pautas.map((p,idx)=>`<div class="pauta-blk">
            <div class="pauta-hd">
              ${p.titulo?`<span class="pauta-titulo">${esc(p.titulo)}</span>`:'<span style="font-size:12px;color:var(--muted);font-style:italic">Pautas da reunião</span>'}
              <div style="display:flex;gap:3px">
                <button class="ico-btn" onclick="App.openModal('editar-pauta',{rid:'${rid}',idx:${idx}})">✏️</button>
                <button class="ico-btn" style="color:var(--err)" onclick="App.delPauta('${rid}',${idx})">🗑️</button>
              </div>
            </div>
            ${p.notas?`<p class="pauta-notas">${esc(p.notas)}</p>`:''}
          </div>`).join('')}
      </div>

      <div class="card">
        <div class="card-hdr">
          <span class="card-title">✅ Encaminhamentos <span style="font-weight:400;font-size:13px;color:var(--muted)">(${encs.length})</span></span>
          <button class="btn btn-p btn-sm" onclick="App.openModal('novo-enc','${rid}')">+ Adicionar</button>
        </div>
        ${!encs.length?'<p style="font-size:13px;color:var(--muted)">Nenhum encaminhamento registrado.</p>'
          :encs.map((e,idx)=>{
            const resps=(e.responsaveis||[]).map(id=>{const p=getPessoa(data,id);return p?p.nome:'?';}).join(', ');
            const eMats=e.materiais||[];
            return `<div class="enc">
              <div class="enc-top">
                <div class="enc-desc">${esc(e.descricao||'')}</div>
                <div style="display:flex;gap:3px;flex-shrink:0">
                  <button class="ico-btn" onclick="App.openModal('editar-enc',{rid:'${rid}',idx:${idx}})">✏️</button>
                  <button class="ico-btn" style="color:var(--err)" onclick="App.delEnc('${rid}',${idx})">🗑️</button>
                </div>
              </div>
              <div class="enc-meta">
                ${resps?`<span>👤 ${esc(resps)}</span>`:''}
                ${e.prazo?`<span>📅 ${fmtDate(e.prazo)}</span>`:''}
                ${badgeStatus(e.status,e.prazo)}
              </div>
              ${e.observacoes?`<div class="enc-obs">${esc(e.observacoes).replace(/\n/g,'<br>')}</div>`:''}
              <div class="stt-row">
                ${['pendente','em_andamento','concluido','cancelado'].map(s=>
                  `<button class="stt-btn ${e.status===s?sttCls[s]:''}" onclick="App.setEncStatus('${rid}',${idx},'${s}')">${sttLbl[s]}</button>`
                ).join('')}
              </div>
              <div class="enc-mat">
                <div class="enc-mat-hd">📎 Materiais
                  <button class="btn btn-o btn-xs" onclick="App.openModal('add-mat',{alvo:'enc',rid:'${rid}',idx:${idx}})">+</button>

      <div class="card">
        <div class="card-hdr"><span class="card-title">📎 Links e Documentos da Reunião</span>
          <button class="btn btn-o btn-sm" onclick="App.openModal('add-mat',{alvo:'reuniao',rid:'${rid}'})">+ Adicionar</button>
        </div>
        ${renderMats(mats,`App.removeMat.bind(App,'reuniao','${rid}',null)`)}
      </div>`;
  },

  /* ── ENCAMINHAMENTOS ── */
  vEncs(data) {
    const fs=this.filters.status, fp=this.filters.pessoa;
    const allEncs=data.reunioes.flatMap(r=>(r.encaminhamentos||[]).map((e,idx)=>({...e,_rid:r.id,_rdata:r.data,_rtit:r.titulo,_idx:idx})));

    const pendentes=allEncs.filter(e=>e.status==='pendente'||e.status==='em_andamento');
    const atrasados=pendentes.filter(e=>isLate(e.prazo));

    let filtered=[...allEncs];
    if (fs==='atrasado') filtered=filtered.filter(e=>(e.status==='pendente'||e.status==='em_andamento')&&isLate(e.prazo));
    else if (fs==='pendente_aberto') filtered=filtered.filter(e=>e.status==='pendente'||e.status==='em_andamento');
    else if (fs) filtered=filtered.filter(e=>e.status===fs);
    if (fp) filtered=filtered.filter(e=>(e.responsaveis||[]).includes(fp));
    filtered.sort((a,b)=>{if(!a.prazo)return 1;if(!b.prazo)return -1;return new Date(a.prazo)-new Date(b.prazo);});

    const byP=data.pessoas.map(p=>{
      const mine=allEncs.filter(e=>(e.responsaveis||[]).includes(p.id));
      return{...p,tot:mine.length,ok:mine.filter(e=>e.status==='concluido').length,open:mine.filter(e=>e.status==='pendente'||e.status==='em_andamento').length};
    }).filter(p=>p.tot>0);

    return `
      <div class="ph"><span class="pt">Encaminhamentos</span></div>

      ${pendentes.length ? `<div class="card" style="margin-bottom:14px;border-top:3px solid var(--warn)">
        <div class="card-hdr">
          <span class="card-title">⏳ Pendentes não resolvidos</span>
          <span class="badge b-pend">${pendentes.length}</span>
        </div>
        ${atrasados.length?`<div style="background:#ffe0e0;color:#8b1414;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:12px">⚠️ ${atrasados.length} com prazo vencido</div>`:''}
        ${pendentes.slice(0,10).map(e=>{
          const resps=getNomes(data,e.responsaveis||[]);
          return`<div class="pend-card">
            <div class="enc-reuniao">📅 ${fmtDate(e._rdata)}${e._rtit?' · '+esc(e._rtit):''}</div>
            <div style="font-size:14px;font-weight:600;margin-bottom:5px">${esc(e.descricao||'').slice(0,100)}${(e.descricao||'').length>100?'…':''}</div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px">
              ${resps?`<span style="color:var(--muted)">👤 ${esc(resps)}</span>`:'<span style="color:var(--err)">👤 Sem responsável</span>'}
              ${e.prazo?`<span style="color:var(--muted)">${isLate(e.prazo)?'⚠️ ':''}${fmtDate(e.prazo)}</span>`:''}
              ${badgeStatus(e.status,e.prazo)}
              <button class="btn btn-o btn-xs" onclick="App.go('reuniao',{id:'${e._rid}'})">Abrir →</button>
            </div>
          </div>`;
        }).join('')}
        ${pendentes.length>10?`<p style="font-size:12px;color:var(--muted);text-align:center;margin-top:8px">+ ${pendentes.length-10} outros — filtre abaixo</p>`:''}
      </div>`
      : `<div class="card" style="margin-bottom:14px;border-top:3px solid var(--ok)">
          <div style="text-align:center;padding:10px;font-size:13px;color:var(--ok);font-weight:700">✅ Todos os encaminhamentos estão resolvidos!</div>
         </div>`}

      ${byP.length?`<div class="card" style="margin-bottom:14px">
        <div class="card-title" style="margin-bottom:14px">Distribuição por pessoa</div>
        ${byP.map(p=>{const pct=p.tot?Math.round(p.ok/p.tot*100):0;return`<div class="prog-wrap">
          <div class="prog-lbl">
            <span><strong>${esc(p.nome)}</strong>${p.area?` · ${esc(p.area)}`:''} — ${p.tot} enc.</span>
            <span>${p.ok} concluídos · ${p.open} em aberto (${pct}%)</span>
          </div>
          <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
        </div>`;}).join('')}
      </div>`:''}

      <div class="fbar">
        <select class="fc" onchange="App.setFilter('status',this.value)">
          <option value="" ${!fs?'selected':''}>Todos os status</option>
          <option value="pendente_aberto" ${fs==='pendente_aberto'?'selected':''}>Em aberto (todos)</option>
          <option value="pendente"     ${fs==='pendente'?'selected':''}>Pendente</option>
          <option value="em_andamento" ${fs==='em_andamento'?'selected':''}>Em andamento</option>
          <option value="concluido"    ${fs==='concluido'?'selected':''}>Concluído</option>
          <option value="cancelado"    ${fs==='cancelado'?'selected':''}>Cancelado</option>
          <option value="atrasado"     ${fs==='atrasado'?'selected':''}>Atrasados</option>
        </select>
        <select class="fc" onchange="App.setFilter('pessoa',this.value)">
          <option value="" ${!fp?'selected':''}>Todas as pessoas</option>
          ${data.pessoas.map(p=>`<option value="${p.id}" ${fp===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}
        </select>
      </div>
      <div class="card">
        ${!filtered.length
          ? `<div class="empty"><div class="empty-ico">✅</div><h3>Nenhum encaminhamento</h3><p>Tente outros filtros.</p></div>`
          : filtered.map(e=>{const resps=getNomes(data,e.responsaveis||[]);return`<div class="li">
              <div class="li-body">
                <div class="li-title">${esc(e.descricao||'').slice(0,80)}${(e.descricao||'').length>80?'…':''}</div>
                <div class="li-meta">
                  <span>📅 ${fmtDate(e._rdata)}</span>
                  ${resps?`<span>👤 ${esc(resps)}</span>`:''}
                  ${e.prazo?`<span>${isLate(e.prazo)&&e.status!=='concluido'?'⚠️ ':''}${fmtDate(e.prazo)}</span>`:''}
                  ${badgeStatus(e.status,e.prazo)}
                </div>
              </div>
              <button class="btn btn-o btn-sm" onclick="App.go('reuniao',{id:'${e._rid}'})">Ver</button>
            </div>`;}).join('')}
      </div>`;
  },

  /* ── PESSOAS ── */
  vPessoas(data) {
    return `
      <div class="ph"><span class="pt">Pessoas</span>
        <button class="btn btn-p" onclick="App.openModal('nova-pessoa')">+ Adicionar</button>
      </div>
      ${!data.pessoas.length?`<div class="card"><div class="empty"><div class="empty-ico">👥</div>
        <h3>Nenhuma pessoa cadastrada</h3><p>Adicione os integrantes do coletivo.</p></div></div>`
        :`<div class="card">${data.pessoas.map((p,idx)=>{
          const encs=data.reunioes.flatMap(r=>r.encaminhamentos||[]).filter(e=>(e.responsaveis||[]).includes(p.id));
          const ok=encs.filter(e=>e.status==='concluido').length, open=encs.filter(e=>e.status!=='concluido'&&e.status!=='cancelado').length;
          return`<div class="li">
            <div class="avatar">${esc(p.nome||'?').charAt(0).toUpperCase()}</div>
            <div class="li-body">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
                <span style="font-weight:700;font-size:14px">${esc(p.nome)}</span>
                <span class="badge ${p.status==='ativo'?'b-ativ':'b-inat'}">${p.status==='ativo'?'Ativo':'Inativo'}</span>
              </div>
              <div class="li-meta">
                ${p.area?`<span>🔧 ${esc(p.area)}</span>`:''}
                <span>📋 ${encs.length} enc.</span><span>✅ ${ok}</span>
                ${open?`<span>⏳ ${open} em aberto</span>`:''}
              </div>
            </div>
            <div style="display:flex;gap:4px">
              <button class="ico-btn" onclick="App.openModal('editar-pessoa',${idx})">✏️</button>
              <button class="ico-btn" style="color:var(--err)" onclick="App.delPessoa(${idx})">🗑️</button>
            </div>
          </div>`;
        }).join('')}</div>`}`;
  },

  /* ============================================================
     MODALS
  ============================================================ */
  openModal(type, payload) {
    this._payload=payload; this._tab='link'; this._file=null;
    const data=DB.get(), el=document.getElementById('modal');

    /* ── COLAR RELATORIA — passo 1 ── */
    if (type === 'colar-relatoria') {
      el.innerHTML = `
        <div class="modal-hdr">
          <span class="modal-title">📋 Colar Relatoria</span>
          <button class="ico-btn" onclick="App.closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">
          Cole o texto completo da ata/relatoria abaixo. O sistema vai identificar automaticamente as pessoas, informes, pautas e encaminhamentos.
        </p>
        <div class="fg">
          <label class="fl">Texto da relatoria</label>
          <textarea class="fc" id="m-relatoria" rows="16" placeholder="09 de Abril de 2026 | Lideranças&#10;Participantes: Ana, Monyse, Carol, Lucas, Nina e Zia&#10;&#10;RELATORIA: Ana&#10;Próxima: Lucas&#10;&#10;Informes&#10;&#10;Lucas I Redação&#10;- ...&#10;&#10;Encaminhamentos&#10;&#10;- ..."></textarea>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
          <button class="btn btn-o" onclick="App.closeModal()">Cancelar</button>
          <button class="btn btn-g" onclick="App.processarRelatoria()">Processar →</button>
        </div>`;
    }

    /* ── nova / editar reunião ── */
    else if (type === 'nova-reuniao' || type === 'editar-reuniao') {
      const isEdit=type==='editar-reuniao';
      const r=isEdit?data.reunioes.find(x=>x.id===payload):null;
      const parts=r?.participantes||[];
      el.innerHTML = `
        <div class="modal-hdr"><span class="modal-title">${isEdit?'Editar':'Nova'} Reunião</span><button class="ico-btn" onclick="App.closeModal()">✕</button></div>
        <div class="frow">
          <div class="fg"><label class="fl">Data</label><input class="fc" type="date" id="m-data" value="${esc(r?.data||new Date().toISOString().slice(0,10))}"></div>
          <div class="fg"><label class="fl">Título</label><input class="fc" type="text" id="m-titulo" placeholder="Ex: Lideranças" value="${esc(r?.titulo||'Lideranças')}"></div>
        </div>
        ${data.pessoas.filter(p=>p.status==='ativo').length?`<div class="fg"><label class="fl">Participantes</label>
          <div class="chk-list">${data.pessoas.filter(p=>p.status==='ativo').map(p=>`
            <label class="chk-item"><input type="checkbox" value="${p.id}" ${parts.includes(p.id)?'checked':''} class="part-chk">
              <span>${esc(p.nome)}${p.area?` <span style="color:var(--muted)">· ${esc(p.area)}</span>`:''}</span></label>`).join('')}
          </div></div>`:''}
        <div class="frow">
          <div class="fg"><label class="fl">Relatoria (fez)</label><select class="fc" id="m-rel">
            <option value="">—</option>
            ${data.pessoas.map(p=>`<option value="${p.id}" ${r?.relatoria===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}
          </select></div>
          <div class="fg"><label class="fl">Próxima Relatoria</label><select class="fc" id="m-prox">
            <option value="">—</option>
            ${data.pessoas.map(p=>`<option value="${p.id}" ${r?.proximaRelatoria===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}
          </select></div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
          <button class="btn btn-o" onclick="App.closeModal()">Cancelar</button>
          <button class="btn btn-p" onclick="App.saveReuniao(${isEdit?`'${payload}'`:'null'})">Salvar</button>
        </div>`;
    }

    /* ── add / editar informe ── */
    else if (type === 'add-informe' || type === 'editar-informe') {
      const isEdit=type==='editar-informe';
      const rid=isEdit?payload.rid:payload;
      const r=data.reunioes.find(x=>x.id===rid);
      const inf=isEdit?(r?.informes||[])[payload.idx]:null;
      el.innerHTML = `
        <div class="modal-hdr"><span class="modal-title">${isEdit?'Editar':'Novo'} Informe</span><button class="ico-btn" onclick="App.closeModal()">✕</button></div>
        <div class="frow">
          <div class="fg"><label class="fl">Pessoa</label><select class="fc" id="m-pessoa" onchange="App.preencheArea(this)">
            <option value="">Selecione...</option>
            ${data.pessoas.map(p=>`<option value="${p.id}" data-area="${esc(p.area||'')}" ${inf?.pessoaId===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}
          </select></div>
          <div class="fg"><label class="fl">Área</label><input class="fc" type="text" id="m-area" placeholder="Ex: Redação" value="${esc(inf?.area||'')}"></div>
        </div>
        <div class="fg"><label class="fl">Texto do informe</label>
          <textarea class="fc" id="m-itens" rows="6" placeholder="Escreva livremente o conteúdo do informe...">${esc(inf?.texto||(inf?.itens||[]).join('\n'))}</textarea>
        </div>

          <button class="btn btn-o" onclick="App.closeModal()">Cancelar</button>

        </div>`;

    /* ── add / editar pauta ── */
    else if (type === 'add-pauta' || type === 'editar-pauta') {
      const isEdit=type==='editar-pauta';
      const rid=isEdit?payload.rid:payload;
      const r=data.reunioes.find(x=>x.id===rid);
      const p=isEdit?(r?.pautas||[])[payload.idx]:null;
      el.innerHTML = `
        <div class="modal-hdr"><span class="modal-title">${isEdit?'Editar':'Nova'} Pauta</span><button class="ico-btn" onclick="App.closeModal()">✕</button></div>
        <div class="fg"><label class="fl">Título</label><input class="fc" type="text" id="m-titulo" placeholder="Ex: Sindicato, Audiência, Financeiro..." value="${esc(p?.titulo||'')}"></div>
        <div class="fg"><label class="fl">Notas de discussão</label><textarea class="fc" id="m-notas" rows="6" placeholder="Resumo dos pontos discutidos...">${esc(p?.notas||'')}</textarea></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
          <button class="btn btn-o" onclick="App.closeModal()">Cancelar</button>
          <button class="btn btn-p" onclick="App.savePauta('${rid}',${isEdit?payload.idx:-1})">Salvar</button>
        </div>`;
    }

    /* ── novo / editar encaminhamento ── */
    else if (type === 'novo-enc' || type === 'editar-enc') {
      const isEdit=type==='editar-enc';
      const rid=isEdit?payload.rid:payload;
      const r=data.reunioes.find(x=>x.id===rid);
      const e=isEdit?(r?.encaminhamentos||[])[payload.idx]:null;
      const sttL={pendente:'Pendente',em_andamento:'Em andamento',concluido:'Concluído',cancelado:'Cancelado'};

  /* ============================================================
     PROCESSAR RELATORIA
  ============================================================ */
  processarRelatoria() {
    const texto = document.getElementById('m-relatoria')?.value?.trim();
    if (!texto || texto.length < 20) { alert('Cole o texto da relatoria antes de processar.'); return; }
    const parsed = parseRelatoria(texto);
    this._parsed  = parsed;
    const data    = DB.get();
    const el      = document.getElementById('modal');

    // Checar quais nomes já existem no banco
    const resolveNomes = (nomes) => nomes.map(n => {
      const p = matchPessoa(data, n);
      return { nome:n, pessoa:p, nova:!p };
    });

    const partsInfo  = resolveNomes(parsed.participantesNomes);
    const relInfo    = parsed.relatoriaName    ? resolveNomes([parsed.relatoriaName])[0]    : null;
    const proxInfo   = parsed.proximaRelatoriaName ? resolveNomes([parsed.proximaRelatoriaName])[0] : null;
    const informesPessoas = parsed.informes.map(inf => ({
      ...inf, info: resolveNomes([inf.pessoaName])[0]
    }));

    const novas = [...partsInfo, relInfo, proxInfo, ...informesPessoas.map(i=>i.info)]
      .filter(x => x && x.nova)
      .reduce((acc,x) => { if(!acc.find(a=>a.nome===x.nome)) acc.push(x); return acc; }, []);

    el.innerHTML = `
      <div class="modal-hdr">
        <span class="modal-title">Revisar antes de salvar</span>
        <button class="ico-btn" onclick="App.openModal('colar-relatoria')">← Voltar</button>
      </div>

      ${novas.length ? `<div class="alert-w" style="margin-bottom:14px">
        ⚠️ <strong>${novas.length} pessoa(s) nova(s)</strong> serão criadas automaticamente:
        ${novas.map(n=>`<strong>${esc(n.nome)}</strong>`).join(', ')}
      </div>` : ''}

      <div class="prev-section">
        <div class="prev-section-title">Reunião</div>
        <div class="prev-row"><span class="prev-ico">📅</span><span class="prev-label">Data:</span><span class="prev-val">${parsed.data?fmtDate(parsed.data):'<em style="color:var(--muted)">não detectada</em>'}</span></div>
        <div class="prev-row"><span class="prev-ico">📌</span><span class="prev-label">Título:</span><span class="prev-val">${esc(parsed.titulo)}</span></div>
        <div class="prev-row"><span class="prev-ico">👥</span><span class="prev-label">Participantes:</span>
          <span class="prev-val">${partsInfo.length
            ? partsInfo.map(x=>`${esc(x.nome)}${x.nova?'<span class="prev-nome-new">nova</span>':''}`).join(', ')
            : '<em style="color:var(--muted)">não detectados</em>'}</span>
        </div>
        <div class="prev-row"><span class="prev-ico">📝</span><span class="prev-label">Relatoria:</span>
          <span class="prev-val">
            ${relInfo?`${esc(relInfo.nome)}${relInfo.nova?'<span class="prev-nome-new">nova</span>':''}`:' <em style="color:var(--muted)">—</em>'}
            ${proxInfo?` → <em>próxima:</em> ${esc(proxInfo.nome)}${proxInfo.nova?'<span class="prev-nome-new">nova</span>':''}`:''}</span>
        </div>
      </div>

      ${parsed.informes.length ? `<div class="prev-section">
        <div class="prev-section-title">📣 ${parsed.informes.length} Informe(s) detectado(s)</div>
        ${informesPessoas.map(inf=>`<div class="prev-item">
          <div class="prev-item-title">${esc(inf.pessoaName)}${inf.area?` <span style="font-weight:400;color:var(--muted)">· ${esc(inf.area)}</span>`:''}</div>
          <div class="prev-item-sub">${inf.itens.length} item(ns)</div>
        </div>`).join('')}
      </div>` : ''}

      ${parsed.pautas.length ? `<div class="prev-section">
        <div class="prev-section-title">🗂 ${parsed.pautas.length} Pauta(s) detectada(s)</div>
        ${parsed.pautas.map(p=>`<div class="prev-item">
          <div class="prev-item-title">${esc(p.titulo)}</div>
          ${p.notas?`<div class="prev-item-sub">${esc(p.notas).slice(0,80)}${p.notas.length>80?'…':''}</div>`:''}
        </div>`).join('')}
      </div>` : ''}

      ${parsed.encaminhamentos.length ? `<div class="prev-section">
        <div class="prev-section-title">✅ ${parsed.encaminhamentos.length} Encaminhamento(s) detectado(s)</div>
        ${parsed.encaminhamentos.map(e=>`<div class="prev-item">
          <div class="prev-item-title">${esc(e.descricao).slice(0,100)}${e.descricao.length>100?'…':''}</div>
          ${e.respName?`<div class="prev-item-sub">👤 Responsável detectado: ${esc(e.respName)}</div>`:''}
        </div>`).join('')}
      </div>` : ''}

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
        <button class="btn btn-o" onclick="App.closeModal()">Cancelar</button>
        <button class="btn btn-g" onclick="App.salvarRelatoria()">✅ Confirmar e Salvar</button>
      </div>`;
  },

  salvarRelatoria() {
    const parsed = this._parsed;
    if (!parsed) return;
    const data = DB.get();

    // 1. Garantir que todas as pessoas existem
    const ensurePessoa = (nome) => {
      if (!nome) return null;
      let p = matchPessoa(data, nome);
      if (!p) {
        p = { id:uid(), nome:nome.trim(), area:'', status:'ativo' };
        data.pessoas.push(p);
      }
      return p;
    };

    // 2. Resolver participantes
    const participantes = parsed.participantesNomes.map(n => ensurePessoa(n)?.id).filter(Boolean);
    const relatoria     = ensurePessoa(parsed.relatoriaName)?.id     || '';
    const proxRel       = ensurePessoa(parsed.proximaRelatoriaName)?.id || '';

    // 3. Resolver informes
    const informes = parsed.informes.map(inf => {
      const p = ensurePessoa(inf.pessoaName);
      return { id:uid(), pessoaId:p?.id||'', area:inf.area, texto:inf.texto||'', itens:inf.itens||[] };
    });

    // 4. Pautas
    const pautas = parsed.pautas.map(p => ({ id:uid(), titulo:p.titulo||'', notas:p.notas||'' }));

    // 5. Encaminhamentos — tenta resolver responsável detectado
    const encaminhamentos = parsed.encaminhamentos.map(e => {
      const resps = [];
      if (e.respName) {
        const p = ensurePessoa(e.respName);
        if (p) resps.push(p.id);
      }
      return { id:uid(), descricao:e.descricao, responsaveis:resps, prazo:'', status:'pendente', observacoes:e.observacoes||'', materiais:[] };
    });

    // 6. Criar reunião
    const reuniao = {
      id: uid(),
      data: parsed.data || new Date().toISOString().slice(0,10),
      titulo: parsed.titulo || 'Lideranças',
      participantes, relatoria, proximaRelatoria: proxRel,
      informes, pautas, encaminhamentos, materiais:[]
    };

    data.reunioes.push(reuniao);
    DB.save(data);
    this._parsed = null;
    this.closeModal();
    toast('Relatoria importada com sucesso!');
    this.go('reuniao', { id: reuniao.id });
  },

  /* ============================================================
     CRUD
  ============================================================ */
  saveReuniao(id=null) {
    const dt=document.getElementById('m-data')?.value;
    if (!dt) { alert('Informe a data.'); return; }
    const parts=[...document.querySelectorAll('.part-chk:checked')].map(c=>c.value);
    const data=DB.get();
    const obj={ data:dt, titulo:document.getElementById('m-titulo')?.value?.trim()||'', participantes:parts,
      relatoria:document.getElementById('m-rel')?.value||'', proximaRelatoria:document.getElementById('m-prox')?.value||'' };
    if (id) { const r=data.reunioes.find(x=>x.id===id); if(r) Object.assign(r,obj); }
    else data.reunioes.push({ id:uid(),...obj, informes:[], pautas:[], encaminhamentos:[], materiais:[] });
    DB.save(data); this.closeModal(); toast('Reunião salva!');
    this.go(id?'reuniao':'reunioes', id?{id}:{});
  },
  delReuniao(id) {
    if (!confirm('Excluir esta reunião e todos os dados vinculados?')) return;
    const data=DB.get(); data.reunioes=data.reunioes.filter(r=>r.id!==id);
    DB.save(data); toast('Excluída.'); this.go('reunioes');
  },
  saveInfome(rid,idx) {
    const pessoaId=document.getElementById('m-pessoa')?.value;
    if (!pessoaId) { alert('Selecione uma pessoa.'); return; }
    const texto=(document.getElementById('m-itens')?.value||'').trim();
    if (!texto) { alert('Escreva o conteúdo do informe.'); return; }
    const data=DB.get(), r=data.reunioes.find(x=>x.id===rid); if(!r) return;
    if (!r.informes) r.informes=[];
    const inf={ id:idx>=0?(r.informes[idx]?.id||uid()):uid(), pessoaId, area:document.getElementById('m-area')?.value?.trim()||'', texto, itens:[] };
    if (idx>=0) r.informes[idx]=inf; else r.informes.push(inf);
    DB.save(data); this.closeModal(); toast('Informe salvo!'); this.go('reuniao',{id:rid});
  },
  delInfome(rid,idx) {
    if (!confirm('Excluir este informe?')) return;
    const data=DB.get(), r=data.reunioes.find(x=>x.id===rid);
    if(r) r.informes.splice(idx,1); DB.save(data); toast('Excluído.'); this.go('reuniao',{id:rid});

    if(r) r.pautas.splice(idx,1); DB.save(data); toast('Excluído.'); this.go('reuniao',{id:rid});

  setFilter(key,val) { this.filters[key]=val; this.render(); },

  saveMat() {
    const payload=this._payload, data=DB.get();
    if (this._tab==='arquivo') {
      if (!this._file) { alert('Selecione um arquivo.'); return; }
      const reader=new FileReader();
      reader.onload=(ev)=>{
        this._attachMat(data,payload,{ id:uid(),tipo:'arquivo', nome:document.getElementById('m-titulo-arq')?.value?.trim()||this._file.name, dados:ev.target.result, tamanho:this._file.size });
        this._file=null;
      };
      reader.readAsDataURL(this._file);
    } else {
      const raw=document.getElementById('m-url')?.value?.trim();
      if (!raw) { alert('Informe a URL.'); return; }
      const url=safeUrl(raw); if (!url) { alert('URL inválida.'); return; }
      this._attachMat(data,payload,{ id:uid(),tipo:'link',url, titulo:document.getElementById('m-titulo')?.value?.trim()||raw, descricao:document.getElementById('m-desc')?.value?.trim()||'' });
    }
  },
  _attachMat(data,payload,m) {
    const r=data.reunioes.find(x=>x.id===payload.rid); if(!r) return;
    if (payload.alvo==='reuniao') { if(!r.materiais) r.materiais=[]; r.materiais.push(m); }
    else { const e=r.encaminhamentos[payload.idx]; if(!e) return; if(!e.materiais) e.materiais=[]; e.materiais.push(m); }
    DB.save(data); this.closeModal(); toast('Material adicionado!'); this.go('reuniao',{id:payload.rid});
  },
  removeMat(alvo,rid,encIdx,matIdx) {
    if (!confirm('Remover?')) return;
    const data=DB.get(), r=data.reunioes.find(x=>x.id===rid); if(!r) return;
    if (alvo==='reuniao') (r.materiais||[]).splice(matIdx,1);
    else { const e=r.encaminhamentos[encIdx]; if(e) (e.materiais||[]).splice(matIdx,1); }
    DB.save(data); toast('Removido.'); this.go('reuniao',{id:rid});
  },
  exportData() { DB.export(); toast('Exportado!'); },
  importData(e) {
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try { DB.import(ev.target.result); toast('Importado!'); this.go('dashboard'); }
      catch { alert('Arquivo inválido.'); }
    };
    reader.readAsText(f); e.target.value='';
  }
};

document.addEventListener('keydown', e=>{ if(e.key==='Escape') App.closeModal(); });
document.addEventListener('input', e=>{ if(e.target.id==='m-area') e.target.dataset.edited='1'; });
if (AUTH.check()) {
  App.go('dashboard');
} else {
  document.getElementById('login-pw')?.focus();
}
</script>
</body>
</html>
